[package]
name = "smallifier-wasm"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Builds smallifier-av1.wasm: everything, plus SVT-AV1.
av1 = ["codecs/av1"]

[dependencies]
codecs = { path = "../codecs" }
smallifier-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
