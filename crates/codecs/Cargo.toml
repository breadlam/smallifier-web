[package]
name = "codecs"
description = "x264 and libopus compiled from vendored sources, with small safe wrappers"
edition.workspace = true
license.workspace = true
version.workspace = true
links = "x264"

[features]
# SVT-AV1 (needs threads: native, or the wasm32-wasip1-threads target).
av1 = []

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
