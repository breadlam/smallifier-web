name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-wasip1
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            third_party
            ~/.cargo/registry
            target
          key: deps-${{ hashFiles('tools/fetch-deps.sh', 'Cargo.lock') }}
      - run: tools/fetch-deps.sh
      - run: cargo test -p smallifier-core --release
      - run: tools/build.sh dist _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
